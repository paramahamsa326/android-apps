<html>
<head>

<script>

function startTime()
{
var now = new Date();
var h=now.getHours();
var min=now.getMinutes();
var s=now.getSeconds();
var ampm=(now.getHours()>11)?"PM":"AM";
var d=now.getDay();
var y=now.getFullYear();
var mon=now.getMonth();
var dm=now.getDate();
var endings=["st","nd","rd","th"];
var dayendings=[0,1,2,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,3,1,2,3,4,4,4,4,4,4,4,1];
var days=["Sun","Mon","Tues","Wed","Thurs","Fri","Sat"];
var months=["Jan","Feb","Mar","Apr","Jun","Jul","Aug","Sept","Nov","Dec"];
if (h>12) h-=12;
if (h==0) h=12;
if (min<10) min="0"+min;
if (s<10) s="0"+s;
dm+=endings[dayendings[dm]];
if (dm<10) dm="0"+dm;

d=days[d];

mon=months[mon-1];

document.getElementById("time").innerHTML=d+" "+mon+" "+dm+" "+y+" <br>"+h+":"+min+":"+s+" "+ampm;

t=setTimeout("startTime()",1000);
}


</script>

</head>
<body onload="startTime();">
<span id="time" ></span>
</body>
</html>
